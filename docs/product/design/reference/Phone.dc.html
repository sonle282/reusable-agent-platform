<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mr Spa Admin — phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: auto; background: #F2F2F7">
  <dc-import name="Main" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme || 'light' }; }
}
</script>
</body>
</html>
